<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>STUDENT REGISTRATION FORM</h1>
    <FORM>
        <fieldset>
            <legend><b>personal details</b></legend>
            <table cellpadding="8">

            <tr>
                <td>full name</td>
             <td><input type="text" name="name"></td> 
             </tr>

             <tr>
             <td>phone number</td>
             <td><input type="text" name="phone number"></td>
             </tr>

             <tr>
             <td>email</td>
             <td><input type="text" name="email"></td>
             </tr>

             <tr>
             <td>password</td>
             <td><input type="text" name="password"></td>
             </tr>

             <tr>
             <td>gender</td>
             <td><input type="radio" name="gender"> female
            <input type="radio" name="gender">male
            </tr>

            <tr>
             <td>Date of Birthh</td>
             <td><input type="date" name="date"></td>
             <tr>
                <td>blood group</td>
                <td>
                    <select> 
                        <option>o+</option>
                        <option>A+</option>
                        <option>b+</option>
                        <option>o-</option>
                        
                    </select>
                </td>
            </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend><b>Educational Details</b></legend>
            <table cellpadding="8"> 

                <tr>
                    <td>College Name</td>
                    <td><input type="text" name="college name"></td>
                </tr>

                <tr>
                    <td>University</td>
                    <td><input type="text" name="University"></td>
                </tr>

                <tr>
                    <td>Course</td>
                    <td>
                        <select>
                            <option>BCA</option>
                            <option>BCOM</option>
                            <option>BBA</option>
                            <option>CSE</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>YEAR</td>
                    <td>
                        <select>
                            <option>1st YEAR</option>
                            <option>2nd YEAR</option>
                            <option>3rd YEAR</option>
                            <option>4th YEAR</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>CGPA</td>
                    <td><input type="text" name="CGPA"></td>
                </tr>
                 
                <tr>
                    <td>skills</td>
                    <td>
                        <input type="checkbox">c++
                        <input type="checkbox">java
                        <input type="checkbox">python
                        <input type="checkbox">HTML
                    </td>
                </tr>
            </table>
        </fieldset>

        <fieldset>
            <legend><b>ADDRESS DETAILS</b></legend>
            <Table cellpadding="8">

                <tr>
                    <td>permanent Address</td>
                    <td><textarea rows="5" cols="25"></textarea></td>
                </tr>

                <tr>
                    <td>Temporary Address</td>
                    <td><textarea rows="5" cols="25"></textarea></td>
                </tr>

                <tr>
                    <td>CITY</td>
                    <td><input type="text" name="CITY"></td>
                </tr>

                <tr>
                    <td>state</td>
                    <td><input type="text" name="state"></td>
                </tr>
            </Table>
            </fieldset>
    </FORM>
</body>
</html>
